const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const btn = document.getElementById('btn');
const img = new Image();
const S = 600 / SZ;
let ready = false;

let audio, actx, analyser, data, useAnalyser = false;
let playing = false, open = 0, zeroFrames = 0, forceSim = false;

img.onload = () => { ready = true; requestAnimationFrame(loop); if (AUTOPLAY) startAudio(true); };
img.src = IMG_SRC;

function setupAudio(withCors){
  audio = new Audio();
  if (withCors) audio.crossOrigin = "anonymous";
  audio.src = AUDIO_URL;
  audio.preload = "auto";
  audio.addEventListener('play',  () => { playing = true;  btn.style.display = 'none'; });
  audio.addEventListener('ended', () => { playing = false; btn.textContent = '↻ Riascolta'; btn.style.display = ''; });
  audio.addEventListener('pause', () => { if(!audio.ended){ playing = false; btn.textContent = '▶ Ascolta'; btn.style.display=''; }});
  if (withCors){
    try{
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio);
      analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.1;
      src.connect(analyser); analyser.connect(actx.destination);
      data = new Uint8Array(analyser.frequencyBinCount); td = new Uint8Array(analyser.fftSize);
      useAnalyser = true;
    }catch(e){ useAnalyser = false; }
  }
}

async function startAudio(silentFail){
  if (!audio) setupAudio(true);
  try{
    if (actx && actx.state === 'suspended') await actx.resume();
    await audio.play();
  }catch(e){
    if (!silentFail) {
      try{ setupAudio(false); useAnalyser = false; await audio.play(); }catch(_){}
    }
  }
}

btn.addEventListener('click', () => {
  if (audio && audio.ended) audio.currentTime = 0;
  startAudio(false);
});

let peak = 0.02, td = null;

function level(){
  if (!playing) return 0;
  if (useAnalyser && !forceSim){
    // onda sonora in tempo reale (nessuna sfocatura temporale): reagisce a ogni sillaba
    analyser.getByteTimeDomainData(td);
    let s = 0;
    for (let i = 0; i < td.length; i++){ const v = (td[i] - 128) / 128; s += v*v; }
    const rms = Math.sqrt(s / td.length);
    // se l'analizzatore non riceve segnale (restrizioni CORS), passa alla bocca simulata
    if (rms === 0 && audio.currentTime > 0.4){ if (++zeroFrames > 40) forceSim = true; } else zeroFrames = 0;
    // normalizzazione adattiva: il picco recente decade piano, così ogni sillaba apre e chiude la bocca
    peak = Math.max(rms, peak * 0.996, 0.02);
    const gate = rms - peak * 0.18;                 // sotto questa soglia la bocca si chiude
    const norm = Math.max(0, gate) / (peak * 0.72);
    return Math.min(1, Math.pow(norm, 0.9));
  }
  // bocca simulata, più veloce e irregolare
  const t = performance.now() / 1000;
  const v = Math.sin(t*17) + 0.7*Math.sin(t*9.3 + 1) + 0.5*Math.sin(t*26 + 2);
  return Math.max(0, Math.min(1, 0.35 + 0.42*v));
}

function loop(now){
  const target = level();
  // apertura rapidissima, chiusura veloce ma non istantanea
  open += (target - open) * (target > open ? 0.92 : 0.6);
  draw(now / 1000);
  requestAnimationFrame(loop);
}

let talkAmt = 0;   // 0 = fermo, 1 = sta parlando (transizione dolce)

function draw(t){
  if (!ready) return;
  const o = open * MAX_OPEN;
  talkAmt += ((playing ? 1 : 0) - talkAmt) * 0.08;

  // movimento della testa: inclinazione, dondolio laterale e "cenni" legati alla voce
  const th = talkAmt * (0.040*Math.sin(t*1.6) + 0.022*Math.sin(t*3.3 + 1.2) + (open - 0.4) * 0.022);
  const dx = talkAmt * (2.5 * Math.sin(t*1.3 + 0.5));
  const dy = talkAmt * (HEAD_DROP + open * 4 + 1.2 * Math.sin(t*2.1));

  ctx.clearRect(0, 0, 600, 600);
  ctx.fillStyle = '#fff8ec'; ctx.fillRect(0, 0, 600, 600);
  ctx.save();
  ctx.scale(S, S);
  ctx.translate(-X0, -Y0);

  // 1) CORPO (collo, sciarpa, camicia): fermo
  ctx.save();
  ctx.beginPath(); ctx.rect(X0 - 10, BODY_Y, SZ + 20, Y0 + SZ - BODY_Y + 10); ctx.clip();
  ctx.drawImage(img, X0, Y0);
  ctx.restore();


  // 2) TESTA (cappello + viso + bocca), ruotata attorno al collo e disegnata sopra il corpo
  ctx.save();
  ctx.translate(dx, dy);
  ctx.translate(PIV_X, PIV_Y); ctx.rotate(th); ctx.translate(-PIV_X, -PIV_Y);
  ctx.beginPath(); ctx.rect(X0 - 60, Y0 - 60, SZ + 120, HEAD_CUT - (Y0 - 60)); ctx.clip();
  ctx.drawImage(img, X0, Y0);

  if (o > 1){
    // bocca aperta: il bordo superiore segue il sorriso, quello inferiore scende
    ctx.beginPath();
    ctx.moveTo(LX, LY);
    ctx.quadraticCurveTo(MID_X, MID_Y, RX, RY);
    ctx.quadraticCurveTo(MID_X + 2, MID_Y + 2*o, LX, LY);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#6b1a1a';              // interno bocca
    ctx.fillRect(LX - 5, LY - 8, RX - LX + 10, o + 40);
    ctx.fillStyle = '#e8737a';              // lingua
    ctx.beginPath();
    ctx.ellipse(MID_X + 8, MID_Y + o*0.85, 22, Math.max(2, o*0.45), 0, 0, Math.PI*2);
    ctx.fill();
    const td2 = 3 + Math.min(o*0.22, 5);    // denti superiori
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(LX, LY - 6);
    ctx.lineTo(RX, RY - 6);
    ctx.lineTo(RX, RY + td2);
    ctx.quadraticCurveTo(MID_X, MID_Y + td2, LX, LY + td2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#2b1408';            // contorno scuro del fumetto
    ctx.lineWidth = 3.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(LX, LY);
    ctx.quadraticCurveTo(MID_X, MID_Y, RX, RY);
    ctx.quadraticCurveTo(MID_X + 2, MID_Y + 2*o, LX, LY);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}
